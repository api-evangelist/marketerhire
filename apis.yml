aid: marketerhire
name: MarketerHire
description: >-
  MarketerHire is a curated marketing-talent marketplace that matches startups, growth-stage
  businesses and Fortune 500 brands with pre-vetted senior freelance and fractional marketers —
  growth marketers, paid-media buyers, SEO and content strategists, email/lifecycle specialists,
  brand and creative talent — typically within 48 hours, backed by a two-week trial. The company
  operates a public marketing site and blog on Webflow, a client/talent application at
  app.marketerhire.com, and a talent portal on talent.marketerhire.com. MarketerHire publishes no
  public developer program, API reference, or machine-readable API contract; its only public
  engineering surface is a small GitHub organization, including mh-brain, the source for its
  internal "BrightMatter" growth-intelligence HTTP service.
